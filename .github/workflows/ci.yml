# Pull Request를 올리거나 main에 머지될 때 코드 스타일과 테스트를 자동으로 검사한다.
# OpenAI API는 부르지 않는다 (팀 사용량 한도 보호).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v6

      - name: 패키지 설치
        run: uv sync

      - name: 코드 스타일 검사
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 테스트
        run: uv run pytest || [ $? -eq 5 ]  # 테스트가 아직 없으면(5) 통과
